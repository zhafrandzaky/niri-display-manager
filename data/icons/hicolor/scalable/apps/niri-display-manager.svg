<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (GNOME Adwaita Blue) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#15539e"/>
    </linearGradient>

    <!-- Top Highlight Ring -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#0d3c75"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="url(#highlight)" stroke-width="1"/>

  <!-- Top-Left: Primary Display (Laptop) [Center X: 42, Y: 43] -->
  <g id="top-left-display">
    <rect x="19" y="25" width="46" height="34" rx="4.5" fill="#ffffff"/>
    <rect x="22" y="28" width="40" height="25" rx="2.5" fill="url(#screen-grad)"/>
    <rect x="25" y="31" width="17" height="9" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="25" y="43" width="34" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.45"/>
    <path d="M 15 62 C 15 61 16 60.5 17.5 60.5 L 66.5 60.5 C 68 60.5 69 61 69 62 L 67.5 65.5 C 67 66.5 65.5 67 64 67 L 20 67 C 18.5 67 17 66.5 16.5 65.5 Z" fill="#ffffff"/>
  </g>

  <!-- Bottom-Right: External Display (Monitor) [Center X: 86, Y: 78] -->
  <g id="bottom-right-display">
    <rect x="63" y="59" width="46" height="36" rx="4.5" fill="#ffffff"/>
    <rect x="66" y="62" width="40" height="27" rx="2.5" fill="url(#screen-grad)"/>
    <rect x="69" y="65" width="17" height="9" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="69" y="77" width="34" height="9" rx="1.5" fill="#ffffff" fill-opacity="0.45"/>
    <circle cx="86" cy="92.5" r="1.3" fill="#33d17a"/>
    <path d="M 84 95 L 84 100 L 77 100 C 75.5 100 75 101 75 102.5 L 97 102.5 C 97 101 96.5 100 95 100 L 88 100 L 88 95 Z" fill="#ffffff"/>
  </g>

  <!-- Center Badge: Switch / Sync Action Icon [Center X: 64, Y: 67] -->
  <g id="center-switch" filter="url(#badge-shadow)">
    <circle cx="64" cy="67" r="14" fill="#ffffff"/>
    <circle cx="64" cy="67" r="12" fill="#f6fafd"/>
    <path d="M 68 62.5 L 59 62.5 M 62.5 59.5 L 58.5 62.5 L 62.5 65.5" 
          fill="none" stroke="#1c71d8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 71.5 L 69 71.5 M 65.5 68.5 L 69.5 71.5 L 65.5 74.5" 
          fill="none" stroke="#3584e4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
